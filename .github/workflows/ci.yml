name: CI & Vercel Auto-Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-deploy:
    name: Verify & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --prefix backend
          npm install --prefix frontend

      - name: Backend Build Check
        run: npm run build --prefix backend

      - name: Frontend TypeScript Typecheck
        run: npx --prefix frontend tsc --project frontend/tsconfig.json --noEmit

      - name: Trigger Vercel Deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Triggering Vercel via Deploy Hook..."
            curl -s -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Deploy hook triggered successfully."
          elif [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Deploying via Vercel CLI..."
            cd frontend
            npx -y vercel deploy --prod --token="$VERCEL_TOKEN" --yes
          else
            echo "Code verified successfully! Native Vercel Git integration handles deployment automatically."
          fi
