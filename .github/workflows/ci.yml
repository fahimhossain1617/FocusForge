name: CI & Vercel Auto-Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-deploy:
    name: Verify & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --prefix backend
          npm install --prefix frontend

      - name: Backend Build Check
        run: npm run build --prefix backend

      - name: Frontend TypeScript Typecheck
        run: npx --prefix frontend tsc --project frontend/tsconfig.json --noEmit

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_f1GuX2gzvNrRJrQ0FqDJOHRh
          vercel-project-id: prj_RiOFlNMIHkuCOeANAIKkO3PJI508
          vercel-args: '--prod'
          working-directory: ./frontend
