name: CI & Vercel Auto-Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-deploy:
    name: Verify & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --prefix backend
          npm install --prefix frontend

      - name: Backend Build Check
        run: npm run build --prefix backend

      - name: Frontend TypeScript Typecheck
        run: npx --prefix frontend tsc --project frontend/tsconfig.json --noEmit

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_f1GuX2gzvNrRJrQ0FqDJOHRh
          VERCEL_PROJECT_ID: prj_RiOFlNMIHkuCOeANAIKkO3PJI508
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ VERCEL_TOKEN is not set in GitHub Secrets!"
            exit 1
          fi
          echo "Deploying frontend to Vercel Production..."
          npx -y vercel --cwd frontend --prod --token="$VERCEL_TOKEN" --yes
